# ==============================================================================
# Nginx Configuration for Exam Jingga DATH Modern Monolith (Django 5.1 + HTMX)
# Domain: exam.smkn1rongga.sch.id
# Target VPS: Ubuntu 24.04 ARM64 (145.241.157.243)
# Features: M3 Maintenance Landing Page with Developer / Preview Bypass Support
# ==============================================================================

upstream exam_jingga_backend {
    server 127.0.0.1:8005 fail_timeout=0;
    keepalive 32;
}

# HTTP Server - Redirect All Traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name exam.smkn1rongga.sch.id;

    # Let's Encrypt ACME Challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Modern TLS & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name exam.smkn1rongga.sch.id;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/exam.smkn1rongga.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exam.smkn1rongga.sch.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/exam-jingga;
    client_max_body_size 50m;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/json
        image/svg+xml;

    # Static Assets (Served directly by Nginx with long cache)
    location /static/ {
        alias /opt/exam-jingga/staticfiles/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Media Uploads (Question illustrations, school assets)
    location /media/ {
        alias /opt/exam-jingga/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
    }

    # Central Data Master API Reverse Proxy (Bypass Browser CORS for OpenAPI sync)
    location ^~ /api/data-master/ {
        rewrite ^/api/data-master/(.*)$ /v1/$1 break;
        proxy_pass https://data.smkn1rongga.sch.id;
        proxy_ssl_server_name on;
        proxy_set_header Host data.smkn1rongga.sch.id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
    }

    # Maintenance Error Page Handler
    error_page 503 @maintenance_page;
    location @maintenance_page {
        root /opt/exam-jingga/static;
        rewrite ^(.*)$ /maintenance.html break;
    }

    # Clear Preview Cookie and Return to Maintenance
    location = /exit-preview {
        add_header Set-Cookie "cbt_preview=; Path=/; Max-Age=0" always;
        return 302 /;
    }

    # Main Application Proxy (Live Production Mode)
    location / {
        set $maintenance_mode 0;

        # 1. Bypass if preview query parameter present (?preview=1)
        if ($arg_preview = "1") {
            set $maintenance_mode 0;
            add_header Set-Cookie "cbt_preview=1; Path=/; Max-Age=86400; SameSite=Lax" always;
        }

        # 2. Bypass if developer cookie is active
        if ($http_cookie ~* "cbt_preview=1") {
            set $maintenance_mode 0;
        }

        # 3. Always allow explicit auth/admin/api endpoints
        if ($uri ~* "^/(auth|login|admin|sso|api)/") {
            set $maintenance_mode 0;
        }

        # Trigger Maintenance page if mode is active
        if ($maintenance_mode = 1) {
            return 503;
        }

        # Proxy to Django Gunicorn backend
        proxy_pass http://exam_jingga_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Concurrency & Timeout Optimizations for HTMX polling & auto-save
        proxy_connect_timeout 75s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffers 8 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 128k;
    }
}
