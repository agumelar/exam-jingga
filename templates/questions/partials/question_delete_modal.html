{% load static %}

<!-- M3 QUESTION DELETE CONFIRMATION MODAL -->
<div 
  x-data="{ showModal: true, isDeleting: false }"
  x-show="showModal"
  x-cloak
  @htmx:after-request="showModal = false"
  @keydown.escape.window="showModal = false"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto"
  role="dialog"
  aria-modal="true"
>
  <!-- Scrim Backdrop -->
  <div 
    x-show="showModal"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click="showModal = false"
    class="fixed inset-0 bg-black/70 backdrop-blur-xs"
  ></div>

  <!-- Modal Dialog Card -->
  <div 
    x-show="showModal"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 scale-95 translate-y-4"
    x-transition:enter-end="opacity-100 scale-100 translate-y-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 scale-100 translate-y-0"
    x-transition:leave-end="opacity-0 scale-95 translate-y-4"
    class="relative z-10 w-full max-w-lg bg-white dark:bg-stone-900 rounded-[2.5rem] p-6 sm:p-8 text-left border border-stone-200 dark:border-stone-800 shadow-2xl my-8"
  >
    <!-- Warning Icon & Title -->
    <div class="flex items-center gap-4 mb-6">
      <div class="w-14 h-14 bg-red-100 dark:bg-red-950/60 text-red-600 dark:text-red-400 rounded-2xl flex items-center justify-center shrink-0">
        <i data-lucide="alert-triangle" class="w-7 h-7"></i>
      </div>
      <div>
        <h3 class="text-xl font-bold text-stone-900 dark:text-white tracking-tight">
          Hapus Butir Soal?
        </h3>
        <p class="text-xs text-stone-500 dark:text-stone-400 font-normal mt-0.5">
          Tindakan ini tidak dapat dibatalkan
        </p>
      </div>
    </div>

    <!-- Question Snippet Preview -->
    <div class="p-4 bg-stone-50 dark:bg-stone-800/60 rounded-2xl border border-stone-200 dark:border-stone-700 text-xs font-normal text-stone-700 dark:text-stone-300 mb-6 max-h-36 overflow-y-auto">
      <div class="text-xs font-semibold text-orange-600 mb-1">
        {{ question.subject.name|default:'Umum' }} &bull; Kelas {{ question.level|default:'-' }}
      </div>
      <p class="line-clamp-3">
        "{{ question.question_text }}"
      </p>
    </div>

    <!-- Actions Form -->
    <form 
      method="post" 
      action="{% url 'questions:delete' pk=question.id %}"
      hx-post="{% url 'questions:delete' pk=question.id %}"
      hx-target="#question-list-container"
      hx-swap="outerHTML"
      @submit="isDeleting = true"
      class="flex items-center gap-3"
    >
      {% csrf_token %}
      <input type="hidden" name="is_htmx" value="1">
      
      <button 
        type="button" 
        @click="showModal = false"
        class="flex-1 py-4 rounded-2xl bg-stone-100 dark:bg-stone-800 hover:bg-stone-200 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-300 font-semibold text-xs transition active:scale-95 cursor-pointer"
      >
        Batal
      </button>

      <button 
        type="submit" 
        :disabled="isDeleting"
        class="flex-1 py-4 rounded-2xl bg-red-600 hover:bg-red-700 text-white font-semibold text-xs shadow-lg shadow-red-600/30 transition active:scale-95 disabled:opacity-50 cursor-pointer"
      >
        <span x-show="!isDeleting">Ya, Hapus Soal</span>
        <span x-show="isDeleting">Menghapus...</span>
      </button>
    </form>

  </div>
</div>
