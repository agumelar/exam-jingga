{% comment %}
Badge fase jadwal (Schedule.phase). Label teks selalu tampil; warna hanya penguat.
Pakai: {% include 'schedules/partials/phase_badge.html' with s=schedule %}
{% endcomment %}
{% with phase=s.phase %}
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border
  {% if phase == 'pending_selection' %}bg-amber-100 text-amber-900 border-amber-300 dark:bg-amber-950/60 dark:text-amber-200 dark:border-amber-800
  {% elif phase == 'waiting_validation' %}bg-blue-100 text-blue-900 border-blue-300 dark:bg-blue-950/60 dark:text-blue-200 dark:border-blue-800
  {% elif phase == 'scheduled' %}bg-stone-100 text-stone-800 border-stone-300 dark:bg-stone-800 dark:text-stone-100 dark:border-stone-600
  {% elif phase == 'running' %}bg-emerald-100 text-emerald-900 border-emerald-300 dark:bg-emerald-950/60 dark:text-emerald-200 dark:border-emerald-800
  {% elif phase == 'missed' %}bg-red-100 text-red-900 border-red-300 dark:bg-red-950/60 dark:text-red-200 dark:border-red-800
  {% else %}bg-stone-200 text-stone-800 border-stone-300 dark:bg-stone-700 dark:text-stone-100 dark:border-stone-600{% endif %}">
  <i data-lucide="{% if phase == 'pending_selection' %}list-checks{% elif phase == 'waiting_validation' %}hourglass{% elif phase == 'scheduled' %}calendar-clock{% elif phase == 'running' %}play{% elif phase == 'missed' %}calendar-x{% else %}check{% endif %}" class="w-3.5 h-3.5" aria-hidden="true"></i>
  <span>{{ s.phase_label }}</span>
</span>
{% endwith %}
