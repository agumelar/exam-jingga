<div id="toast-warning" role="alert" class="fixed top-20 inset-x-4 sm:inset-x-auto sm:right-6 z-50 p-4 rounded-2xl bg-amber-400 text-stone-950 shadow-2xl flex items-start gap-3 max-w-sm">
  <i data-lucide="alert-triangle" class="w-5 h-5 shrink-0" aria-hidden="true"></i>
  <div>
    <p class="text-sm font-bold">Peringatan pindah layar ({{ count }}{% if is_official %}/2{% endif %})</p>
    <p class="text-sm">{% if is_official %}Pelanggaran berikutnya mengunci ujian Anda. Tetap di halaman ujian.{% else %}Tetap fokus di halaman ujian.{% endif %}</p>
  </div>
</div>
<script>
  setTimeout(() => { const t = document.getElementById('toast-warning'); if (t) t.remove(); }, 4000);
  if (window.lucide) lucide.createIcons();
</script>
