{% extends 'base.html' %}
{% load static %}

{% block title %}Masuk - EXAM JINGGA{% endblock %}

{% block layout %}
<div class="min-h-screen bg-stone-50 dark:bg-stone-950 flex flex-col justify-center items-center p-4 sm:p-6 font-sans relative text-left select-none">
  
  <!-- Clean M3 Theme Toggle FAB (Top Right) -->
  <button 
    type="button"
    onclick="window.toggleTheme()" 
    aria-label="Ganti Tema"
    class="absolute top-6 right-6 p-3 rounded-full bg-white dark:bg-stone-900 shadow-md text-stone-600 dark:text-orange-400 hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors border border-stone-200 dark:border-stone-800 z-20 cursor-pointer"
  >
    <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i>
    <i data-lucide="moon" class="w-5 h-5 hidden dark:inline"></i>
  </button>

  <!-- Auth Card Container -->
  <div class="w-full max-w-md">
    {% block auth_content %}
      <!-- Default Auth Card Preview / Slot -->
      <div class="bg-white dark:bg-stone-900 p-8 sm:p-10 rounded-3xl relative z-10 border border-stone-200 dark:border-stone-800 m3-elevation-3 text-left">
        
        <!-- Header / Logo -->
        <div class="text-center mb-8">
          <div class="inline-block mb-4">
            <img 
              src="{% static 'img/logo_sekolah.png' %}" 
              alt="Logo SMKN 1 Rongga" 
              class="w-24 h-24 mx-auto object-contain drop-shadow-md"
            >
          </div>

          <div class="flex items-center justify-center gap-2.5 mb-1.5">
            <div class="bg-orange-600 text-white p-2 rounded-2xl shadow-md shadow-orange-600/20 shrink-0">
              <i data-lucide="sparkles" class="w-4.5 h-4.5"></i>
            </div>
            <!-- EXAM JINGGA -->
            <h1 class="text-2xl sm:text-3xl font-bold text-stone-900 dark:text-white tracking-tight">
              Exam <span class="text-orange-600 dark:text-orange-500">Jingga</span>
            </h1>
          </div>
          <p class="text-xs text-stone-500 dark:text-stone-400 font-normal">
            Sistem CBT SMKN 1 Rongga
          </p>
        </div>

        {% block auth_form %}
          <!-- Form Slot -->
        {% endblock %}
      </div>
    {% endblock %}
  </div>

  <!-- Footer Info -->
  <footer class="mt-8 text-center text-xs text-stone-400 dark:text-stone-600 font-medium">
    &copy; {% now "Y" %} SMKN 1 Rongga &bull; CBT Exam Jingga
  </footer>
</div>
{% endblock %}
